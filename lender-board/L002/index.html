<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>Torque Lender Board</title>
<style>
  :root{
    --bg:#f4f5f7;
    --surface:#ffffff;
    --ink:#171a1f;
    --muted:#5c6470;
    --faint:#8a919c;
    --line:#e2e5ea;
    --accent:#1450a0;
    --accent-ink:#ffffff;
    --accent-soft:#e8eff9;
    --amber-bg:#fdf0d3;
    --amber-ink:#7a5200;
    --green-bg:#dff3e2;
    --green-ink:#1d6b32;
    --gray-bg:#e8eaed;
    --gray-ink:#4c545e;
    --red:#c0271d;
    --red-bg:#fdecea;
    --radius:14px;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; cursor:pointer; }
  .wrap{ max-width:680px; margin:0 auto; padding:20px 16px 8px; }
  .kicker{
    font-size:13px; font-weight:600; letter-spacing:.04em;
    color:var(--accent); text-transform:uppercase; margin:0 0 6px;
  }
  h1.lender-name{ font-size:30px; line-height:1.15; margin:0; font-weight:800; letter-spacing:-.01em; }
  .company{ font-size:17px; color:var(--muted); margin:4px 0 0; } .listings-stat{ font-size:15px; font-weight:650; color:var(--accent); margin:6px 0 0; }
  .tiles{ display:flex; gap:10px; margin:20px 0 6px; }
  .tile{
    flex:1 1 0; min-height:76px;
    background:var(--surface); border:2px solid var(--line); border-radius:var(--radius);
    padding:10px 6px 8px; text-align:center; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  .tile .num{ font-size:28px; font-weight:800; line-height:1.1; }
  .tile .lbl{ font-size:13px; font-weight:600; color:var(--muted); }
  .tile[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); }
  .tile[aria-pressed="true"] .lbl{ color:var(--accent); }
  .tile:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .filter-note{ font-size:13px; color:var(--muted); margin:8px 2px 0; min-height:18px; }
  .filter-note button{
    background:none; border:none; color:var(--accent); font-weight:600;
    padding:8px 6px; min-height:36px; text-decoration:underline;
  }
    .snapshot-row{ display:flex; justify-content:flex-end; margin:2px 2px 0; }   #snapshotBtn{     background:var(--surface); color:var(--accent); border:1.5px solid var(--line);     border-radius:8px; font-size:13.5px; font-weight:650; padding:6px 12px; min-height:36px;   }   #snapshotBtn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }   #snapshotBtn:disabled{ opacity:.55; cursor:default; }   h2.section{ font-size:15px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); margin:24px 2px 10px; }
  .empty{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 16px; color:var(--muted); font-size:15px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin:0 0 12px;
  }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .buyer{ font-size:21px; font-weight:750; line-height:1.2; margin:0; overflow-wrap:anywhere; }
  .ref{ font-size:13px; font-weight:600; color:var(--faint); margin-left:7px; white-space:nowrap; }
  .pill{
    flex:0 0 auto; font-size:12.5px; font-weight:700; line-height:1;
    padding:6px 10px; border-radius:999px; white-space:nowrap; margin-top:2px;
  }
  .pill-new{ background:var(--accent); color:var(--accent-ink); }
  .pill-working{ background:var(--amber-bg); color:var(--amber-ink); }
  .pill-funded{ background:var(--green-bg); color:var(--green-ink); }
  .pill-no_deal{ background:var(--gray-bg); color:var(--gray-ink); }
  .overdue{
    display:inline-block; margin-top:10px;
    background:var(--red-bg); color:var(--red);
    font-size:12.5px; font-weight:800; letter-spacing:.05em;
    padding:5px 9px; border-radius:6px;
  }
  .phone{
    display:inline-block; margin-top:8px;
    font-size:18px; font-weight:650; color:var(--accent);
    text-decoration:none; padding:6px 0; min-height:36px;
  }
  .phone:active{ text-decoration:underline; }
  .vehicle{ font-size:16px; margin:2px 0 0; overflow-wrap:anywhere; }
  .contact{ font-size:15px; margin:8px 0 0; color:var(--ink); overflow-wrap:anywhere; }
  .contact .lbl{ color:var(--muted); }
  .meta{ display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:10px; font-size:13.5px; color:var(--muted); }
  .actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .btn{
    flex:1 1 auto; min-height:48px; min-width:104px;
    border-radius:10px; border:1.5px solid var(--accent);
    background:var(--accent); color:var(--accent-ink);
    font-size:15.5px; font-weight:650; padding:10px 12px;
  }
  .btn.secondary{ background:var(--surface); color:var(--accent); }
  .btn.plain{ background:var(--surface); color:var(--ink); border-color:var(--line); }
  .btn:disabled{ opacity:.55; cursor:default; }
  .btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .save-err{ font-size:14px; color:var(--red); margin:10px 0 0; font-weight:600; }
  .commission-box{ margin-top:14px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; padding:12px; }
  .commission-box label{ display:block; font-size:14px; font-weight:700; margin-bottom:6px; }
  .commission-box input{ width:100%; min-height:44px; font-size:17px; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); }
  .commission-line{ font-size:15px; font-weight:650; margin:10px 0 0; }
  .notes{ margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
  .notes label{ display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  .notes textarea{ width:100%; min-height:56px; font:inherit; font-size:15px; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); resize:vertical; }
  .pin-input{ width:170px; min-height:52px; font-size:26px; letter-spacing:.35em; text-align:center; padding:8px 10px; border:2px solid var(--accent); border-radius:10px; margin:6px 0 12px; }
  .lock-err{ font-size:15px; color:var(--red); font-weight:600; margin:12px 0 0; }
  footer{ text-align:center; color:var(--faint); font-size:13px; padding:26px 16px 34px; }
  .center-msg{ max-width:520px; margin:0 auto; padding:64px 24px; text-align:center; font-size:17px; line-height:1.55; color:var(--ink); }
  .center-msg .spin{ color:var(--muted); }
  [hidden]{ display:none !important; }
  @media (min-width:560px){
    .wrap{ padding:28px 20px 8px; }
    h1.lender-name{ font-size:34px; }
  }
</style>
<script>window.__BOARD_TOKEN__="0ef3f25d3ac7becc2b89b56afb2540c4";</script>
</head>
<body>
<div id="loading" class="center-msg"><span class="spin">Loading your applications…</span></div>
<div id="badlink" class="center-msg" hidden>This link isn&rsquo;t complete. Text Gary at <a href="tel:9195844860" style="color:var(--accent); font-weight:650;">919-584-4860</a> and he&rsquo;ll send your full link.</div>
<div id="lockscreen" class="center-msg" hidden>
  <p class="kicker">Torque Hub &mdash; Financing Applications</p>
  <h2 id="lockName" style="font-size:28px;line-height:1.2;margin:0 0 4px;"></h2>
  <p id="lockCompany" style="font-size:17px;color:var(--muted);margin:0 0 16px;"></p>
  <p>Enter your 4-digit PIN to open your board.</p>
  <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;" aria-label="4-digit PIN" />
  <div><button id="unlockBtn" type="button" class="btn" style="min-width:170px;">Unlock</button></div>
  <p id="lockErr" class="lock-err" hidden></p>
</div>
<div id="app" hidden>
  <div class="wrap">
    <header>
      <p class="kicker">Torque Hub &mdash; Financing Applications</p>
      <h1 class="lender-name" id="lenderName"></h1>
      <p class="company" id="lenderCompany"></p> <p class="listings-stat" id="lenderListings" hidden></p>
    </header>
    <div class="tiles" role="group" aria-label="Filter by status">
      <button type="button" class="tile" id="tileNew" aria-pressed="false">
        <span class="num" id="countNew">0</span><span class="lbl">New</span>
      </button>
      <button type="button" class="tile" id="tileWorking" aria-pressed="false">
        <span class="num" id="countWorking">0</span><span class="lbl">Working</span>
      </button>
      <button type="button" class="tile" id="tileDone" aria-pressed="false">
        <span class="num" id="countDone">0</span><span class="lbl">Done</span>
      </button>
    </div>
    <div class="snapshot-row"><button type="button" id="snapshotBtn">Snapshot</button></div> <p class="filter-note" id="filterNote"></p>
    <main id="list"></main>
  </div>
  <footer>Torque DMA &middot; hub.torquedma.com</footer>
</div>
<script>
(function(){
  "use strict";
  var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4c2lra21xYXN5ZG9zbWJsem92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4OTc1OTksImV4cCI6MjA5MDQ3MzU5OX0.JMEI7cx2tddmbvfqm_qxiIWp7f5Phuk5l0Y487DUSZg';
  var FN_URL = 'https://bxsikkmqasydosmblzov.supabase.co/functions/v1/lender-board';
  var HEADERS = { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + SB_ANON };
  var token = window.__BOARD_TOKEN__ || new URLSearchParams(window.location.search).get('t');
  var PIN_KEY = 'torque-lender-pin:' + token;
  var pin = '';
  try { pin = sessionStorage.getItem(PIN_KEY) || ''; } catch (e) {}
  var elLoading = document.getElementById('loading');
  var elBad = document.getElementById('badlink');
  var elApp = document.getElementById('app');
  var elList = document.getElementById('list');
  var elFilterNote = document.getElementById('filterNote');
  var elLock = document.getElementById('lockscreen');
  var elLockName = document.getElementById('lockName');
  var elLockCompany = document.getElementById('lockCompany');
  var elPinInput = document.getElementById('pinInput');
  var elLockErr = document.getElementById('lockErr');
  var leads = [];
  var filter = null;
  var saving = {};
  var commissionFor = null;
  function showBadLink(){ elLoading.hidden = true; elApp.hidden = true; elLock.hidden = true; elBad.hidden = false; }
  function showLock(person, msg){
    elLoading.hidden = true; elApp.hidden = true; elBad.hidden = true; elLock.hidden = false;
    if (person){ elLockName.textContent = (person.name || '') + "'s board"; elLockCompany.textContent = person.company || ''; }
    if (msg){ elLockErr.textContent = msg; elLockErr.hidden = false; } else { elLockErr.hidden = true; }
  }
  function fmtMoney(v){ var n = Number(v); if (!isFinite(n)) return ''; return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  var dayFmt = new Intl.DateTimeFormat('en-US', { timeZone:'America/New_York', year:'numeric', month:'numeric', day:'numeric' });
  var timeFmt = new Intl.DateTimeFormat('en-US', { timeZone:'America/New_York', hour:'numeric', minute:'2-digit', hour12:true });
  var dateFmt = new Intl.DateTimeFormat('en-US', { timeZone:'America/New_York', month:'short', day:'numeric' });
  function dayKey(d){ return dayFmt.format(d); }
  function receivedLabel(iso){
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var now = new Date();
    var time = timeFmt.format(d);
    if (dayKey(d) === dayKey(now)) return 'Today ' + time;
    var yest = new Date(now.getTime() - 24*60*60*1000);
    if (dayKey(d) === dayKey(yest)) return 'Yesterday ' + time;
    return dateFmt.format(d) + ', ' + time;
  }
  function isOverdue(lead){
    if (lead.status !== 'new') return false;
    var t = new Date(lead.received_at).getTime();
    if (isNaN(t)) return false;
    return (Date.now() - t) > 24*60*60*1000;
  }
  var PILL = {
    new:     { cls:'pill-new',     label:'New' },
    working: { cls:'pill-working', label:'Working on it' },
    funded:  { cls:'pill-funded',  label:'Funded' },
    no_deal: { cls:'pill-no_deal', label:'No deal' }
  };
  function bucketOf(status){
    if (status === 'new') return 'new';
    if (status === 'working') return 'working';
    return 'done';
  }
  function counts(){
    var c = { new:0, working:0, done:0 };
    leads.forEach(function(l){ c[bucketOf(l.status)]++; });
    return c;
  }
  function buttonsFor(lead){
    var busy = !!saving[lead.id];
    function btn(status, label, cls){
      return '<button type="button" class="btn ' + cls + '" data-lead="' + esc(lead.id) +
             '" data-status="' + status + '"' + (busy ? ' disabled' : '') + '>' +
             (busy ? 'Saving&hellip;' : esc(label)) + '</button>';
    }
    if (lead.status === 'new'){
      return btn('working','Working on it','') + btn('funded','Funded','secondary') + btn('no_deal','No deal','plain');
    }
    if (lead.status === 'working'){
      return btn('funded','Funded','') + btn('no_deal','No deal','plain') + btn('new','Put back to New','secondary');
    }
    return btn('new','Put back to New','secondary');
  }
  function cardHTML(lead){
    var pill = PILL[lead.status] || PILL.new;
    var ref = lead.lead_ref ? '<span class="ref">' + esc(lead.lead_ref) + '</span>' : '';
    var phoneDigits = String(lead.buyer_phone || '').replace(/[^0-9+]/g,'');
    var phone = lead.buyer_phone
      ? '<a class="phone" href="tel:' + esc(phoneDigits) + '">' + esc(lead.buyer_phone) + '</a>' : '';
    var vehicleParts = [lead.vehicle, lead.stock_number].filter(function(x){ return x && String(x).trim(); });
    if (lead.price != null && String(lead.price).trim() !== '') vehicleParts.push(fmtMoney(lead.price));
    var vehicle = vehicleParts.length
      ? '<p class="vehicle">' + esc(vehicleParts.join(' \u00b7 ')) + '</p>' : '';
    var contact = lead.dealer_contact
      ? '<p class="contact"><span class="lbl">Dealership contact:</span> ' + esc(lead.dealer_contact) + '</p>' : '';
    var meta = '';
    var when = receivedLabel(lead.received_at);
    if (when) meta += '<span>Received ' + esc(when) + '</span>';
    if (lead.source) meta += '<span>' + esc(lead.source) + '</span>';
    if (meta) meta = '<div class="meta">' + meta + '</div>';
    var overdue = isOverdue(lead) ? '<span class="overdue">OVERDUE</span>' : '';
    var commissionLine = '';
    if (lead.status === 'funded'){
      commissionLine = (lead.commission != null && String(lead.commission).trim() !== '')
        ? '<p class="commission-line">Commission coming to Torque: ' + esc(fmtMoney(lead.commission)) + '</p>'
        : '<p class="commission-line">Commission: not entered yet</p>';
    }
    var commissionBox = '';
    if (commissionFor && String(commissionFor) === String(lead.id)){
      commissionBox = '<div class="commission-box"><label for="comm-' + esc(lead.id) + '">Commission coming to Torque ($)</label>' +
        '<input id="comm-' + esc(lead.id) + '" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" />' +
        '<div class="actions"><button type="button" class="btn" data-commission-save="' + esc(lead.id) + '">Save &amp; mark funded</button>' +
        '<button type="button" class="btn plain" data-commission-cancel="' + esc(lead.id) + '">Cancel</button></div></div>';
    }
    var notesBox = '<div class="notes"><label for="notes-' + esc(lead.id) + '">Notes</label>' +
      '<textarea id="notes-' + esc(lead.id) + '" data-notes="' + esc(lead.id) + '" placeholder="Add a note&hellip;">' + esc(lead.notes || '') + '</textarea>' +
      '<div class="actions"><button type="button" class="btn secondary" data-notes-save="' + esc(lead.id) + '">Save</button></div></div>';
    return '<article class="card" data-card="' + esc(lead.id) + '">' +
      '<div class="card-top"><h3 class="buyer">' + esc(lead.buyer_name || 'Buyer') + ref + '</h3>' +
      '<span class="pill ' + pill.cls + '">' + pill.label + '</span></div>' +
      overdue +
      '<div>' + phone + '</div>' +
      vehicle + contact + meta + commissionLine +
      '<div class="actions">' + buttonsFor(lead) + '</div>' +
      commissionBox + notesBox +
      '<p class="save-err" data-err="' + esc(lead.id) + '" hidden>Couldn&rsquo;t save that &mdash; tap to try again.</p>' +
      '</article>';
  }
  function render(){
    var c = counts();
    document.getElementById('countNew').textContent = c.new;
    document.getElementById('countWorking').textContent = c.working;
    document.getElementById('countDone').textContent = c.done;
    document.getElementById('tileNew').setAttribute('aria-pressed', filter === 'new' ? 'true' : 'false');
    document.getElementById('tileWorking').setAttribute('aria-pressed', filter === 'working' ? 'true' : 'false');
    document.getElementById('tileDone').setAttribute('aria-pressed', filter === 'done' ? 'true' : 'false');
    if (filter){
      var names = { new:'New', working:'Working', done:'Done' };
      elFilterNote.innerHTML = 'Showing ' + names[filter] + ' only. <button type="button" id="clearFilter">Show all</button>';
      document.getElementById('clearFilter').addEventListener('click', function(){ filter = null; render(); });
    } else {
      elFilterNote.textContent = '';
    }
    var visible = leads.filter(function(l){ return !filter || bucketOf(l.status) === filter; });
    var needs = visible.filter(function(l){ return l.status === 'new' || l.status === 'working'; });
    var worked = visible.filter(function(l){ return l.status === 'funded' || l.status === 'no_deal'; });
    var html = '';
    if (!leads.length){
      html = '<div class="empty">No financing applications yet. New ones will show up here as buyers are sent your way.</div>';
    } else if (!visible.length){
      html = '<div class="empty">Nothing in this bucket right now.</div>';
    } else {
      if (needs.length){
        html += '<h2 class="section">Needs action</h2>' + needs.map(cardHTML).join('');
      }
      if (worked.length){
        html += '<h2 class="section">Worked</h2>' + worked.map(cardHTML).join('');
      }
    }
    elList.innerHTML = html;
  }
  var failedSaves = {};
  function setStatus(leadId, status, commission){
    if (saving[leadId]) return;
    saving[leadId] = true;
    delete failedSaves[leadId];
    commissionFor = null;
    var lockedDuringSave = false;
    render();
    var body = { token: token, action: 'setStatus', lead_id: leadId, status: status, pin: pin };
    if (commission !== undefined && commission !== null && commission !== '') body.commission = commission;
    fetch(FN_URL, {
      method: 'POST',
      headers: Object.assign({}, HEADERS, { 'Content-Type': 'application/json' }),
      body: JSON.stringify(body)
    }).then(function(r){
      if (!r.ok) throw new Error('save failed');
      return r.json();
    }).then(function(data){
      if (data && data.locked){
        lockedDuringSave = true;
        pin = '';
        try { sessionStorage.removeItem(PIN_KEY); } catch (e) {}
        showLock(data.lender, data.lockout ? 'Too many wrong tries \u2014 this board is locked for an hour.' : "That PIN doesn't match \u2014 try again.");
        return;
      }
      if (!data || !data.ok || !data.lead) throw new Error('save failed');
      for (var i = 0; i < leads.length; i++){
        if (String(leads[i].id) === String(data.lead.id)){ leads[i] = data.lead; break; }
      }
      leads.sort(function(a,b){ return new Date(b.received_at) - new Date(a.received_at); });
    }).catch(function(){
      if (!lockedDuringSave) failedSaves[leadId] = true;
    }).then(function(){
      saving[leadId] = false;
      render();
      if (failedSaves[leadId]){
        var e = elList.querySelector('[data-err="' + CSS.escape(String(leadId)) + '"]');
        if (e) e.hidden = false;
      }
    });
  }
  function setNotes(leadId, btn){
    var ta = elList.querySelector('[data-notes="' + CSS.escape(String(leadId)) + '"]');
    if (!ta) return;
    var text = ta.value;
    btn.disabled = true;
    btn.textContent = 'Saving\u2026';
    fetch(FN_URL, {
      method: 'POST',
      headers: Object.assign({}, HEADERS, { 'Content-Type': 'application/json' }),
      body: JSON.stringify({ token: token, action: 'setNotes', lead_id: leadId, pin: pin, notes: text })
    }).then(function(r){
      if (!r.ok) throw new Error('save failed');
      return r.json();
    }).then(function(data){
      if (data && data.locked){
        pin = '';
        try { sessionStorage.removeItem(PIN_KEY); } catch (e) {}
        showLock(data.lender, data.lockout ? 'Too many wrong tries \u2014 this board is locked for an hour.' : "That PIN doesn't match \u2014 try again.");
        throw new Error('locked');
      }
      if (!data || !data.ok || !data.lead) throw new Error('save failed');
      for (var i = 0; i < leads.length; i++){
        if (String(leads[i].id) === String(data.lead.id)){ leads[i] = data.lead; break; }
      }
      btn.textContent = 'Saved';
      setTimeout(function(){ btn.disabled = false; btn.textContent = 'Save'; }, 1500);
    }).catch(function(){
      btn.disabled = false;
      btn.textContent = 'Save';
      var e = elList.querySelector('[data-err="' + CSS.escape(String(leadId)) + '"]');
      if (e) e.hidden = false;
    });
  }
  elList.addEventListener('click', function(ev){
    var notesBtn = ev.target.closest('button[data-notes-save]');
    if (notesBtn){ setNotes(notesBtn.getAttribute('data-notes-save'), notesBtn); return; }
    var commSave = ev.target.closest('button[data-commission-save]');
    if (commSave){
      var cid = commSave.getAttribute('data-commission-save');
      var input = document.getElementById('comm-' + cid);
      var val = input ? input.value.trim() : '';
      commissionFor = null;
      setStatus(cid, 'funded', val === '' ? null : val);
      return;
    }
    var commCancel = ev.target.closest('button[data-commission-cancel]');
    if (commCancel){ commissionFor = null; render(); return; }
    var btn = ev.target.closest('button[data-lead]');
    if (!btn || btn.disabled) return;
    var st = btn.getAttribute('data-status');
    if (st === 'funded'){
      commissionFor = btn.getAttribute('data-lead');
      render();
      var inp = document.getElementById('comm-' + commissionFor);
      if (inp) inp.focus();
      return;
    }
    setStatus(btn.getAttribute('data-lead'), st);
  });
  function wireTile(id, bucket){
    document.getElementById(id).addEventListener('click', function(){
      filter = (filter === bucket) ? null : bucket;
      render();
    });
  }
  wireTile('tileNew', 'new');
  wireTile('tileWorking', 'working');
  wireTile('tileDone', 'done'); function takeSnapshot(){ var btn=document.getElementById('snapshotBtn'); var source=document.getElementById('app'); if(!source||!btn){return;} btn.disabled=true; var originalLabel=btn.textContent; btn.textContent='Capturing…'; try{ var w=source.scrollWidth; var h=source.scrollHeight; var clone=source.cloneNode(true); var srcNodes=[source].concat(Array.prototype.slice.call(source.querySelectorAll('*'))); var cloneNodes=[clone].concat(Array.prototype.slice.call(clone.querySelectorAll('*'))); srcNodes.forEach(function(srcNode,i){ var cs=getComputedStyle(srcNode); var style=cloneNodes[i].style; for(var j=0;j<cs.length;j++){ var prop=cs[j]; try{ style.setProperty(prop,cs.getPropertyValue(prop),cs.getPropertyPriority(prop)); }catch(e){} } if(srcNode.tagName==='TEXTAREA'){ cloneNodes[i].textContent=srcNode.value; } if(srcNode.tagName==='INPUT'){ cloneNodes[i].setAttribute('value',srcNode.value); } }); var snapRow=clone.querySelector('.snapshot-row'); if(snapRow){ snapRow.remove(); } clone.setAttribute('xmlns','http://www.w3.org/1999/xhtml'); clone.style.width=w+'px'; clone.style.height=h+'px'; var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><foreignObject x="0" y="0" width="'+w+'" height="'+h+'">'+new XMLSerializer().serializeToString(clone)+'</foreignObject></svg>'; var img=new Image(); img.onload=function(){ try{ var scale=2; var canvas=document.createElement('canvas'); canvas.width=w*scale; canvas.height=h*scale; var ctx=canvas.getContext('2d'); ctx.fillStyle='#f4f5f7'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.scale(scale,scale); ctx.drawImage(img,0,0,w,h); canvas.toBlob(function(blob){ btn.disabled=false; btn.textContent=originalLabel; if(!blob){return;} var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='board-snapshot.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); },1000); },'image/png'); }catch(err){ btn.disabled=false; btn.textContent=originalLabel; } }; img.onerror=function(){ btn.disabled=false; btn.textContent=originalLabel; }; img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); }catch(err){ btn.disabled=false; btn.textContent=originalLabel; } } document.getElementById('snapshotBtn').addEventListener('click',takeSnapshot);
  function showBoard(data){
    document.getElementById('lenderName').textContent = data.lender.name || '';
    document.getElementById('lenderCompany').textContent = data.lender.company || ''; if (typeof data.listings_count === 'number') { var lEl = document.getElementById('lenderListings'); lEl.textContent = 'Listings: ' + data.listings_count; lEl.hidden = false; }
    leads = data.leads.slice().sort(function(a,b){
      return new Date(b.received_at) - new Date(a.received_at);
    });
    elLoading.hidden = true;
    elLock.hidden = true;
    elBad.hidden = true;
    elApp.hidden = false;
    render();
  }
  function unlock(){
    var entered = elPinInput.value.trim();
    if (!/^\d{4}$/.test(entered)){
      elLockErr.textContent = "That PIN doesn't match \u2014 try again.";
      elLockErr.hidden = false;
      return;
    }
    elLockErr.hidden = true;
    fetch(FN_URL, {
      method: 'POST',
      headers: Object.assign({}, HEADERS, { 'Content-Type': 'application/json' }),
      body: JSON.stringify({ token: token, action: 'unlock', pin: entered })
    }).then(function(r){ return r.json(); }).then(function(data){
      if (!data || data.locked){
        elLockErr.textContent = (data && data.lockout) ? 'Too many wrong tries \u2014 this board is locked for an hour.' : "That PIN doesn't match \u2014 try again.";
        elLockErr.hidden = false;
        if (data && data.lender){ elLockName.textContent = (data.lender.name || '') + "'s board"; elLockCompany.textContent = data.lender.company || ''; }
        return;
      }
      pin = entered;
      try { sessionStorage.setItem(PIN_KEY, pin); } catch (e) {}
      showBoard(data);
    }).catch(function(){
      elLockErr.textContent = "Couldn't reach the board \u2014 check your connection and try again.";
      elLockErr.hidden = false;
    });
  }
  document.getElementById('unlockBtn').addEventListener('click', unlock);
  elPinInput.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') unlock(); });
  if (!token){
    showBadLink();
    return;
  }
  if (pin){
    fetch(FN_URL + '?token=' + encodeURIComponent(token) + '&pin=' + encodeURIComponent(pin), { headers: HEADERS })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data && data.locked){
          pin = '';
          try { sessionStorage.removeItem(PIN_KEY); } catch (e) {}
          showLock(data.lender, data.lockout ? 'Too many wrong tries \u2014 this board is locked for an hour.' : null);
          return;
        }
        if (!data || !data.lender || !Array.isArray(data.leads)) throw new Error('bad token');
        showBoard(data);
      })
      .catch(function(){ showBadLink(); });
  } else {
    fetch(FN_URL + '?token=' + encodeURIComponent(token), { headers: HEADERS })
      .then(function(r){
        if (!r.ok) throw new Error('bad token');
        return r.json();
      })
      .then(function(data){
        if (data && data.locked){ showLock(data.lender, null); return; }
        if (!data || !data.lender) throw new Error('bad token');
        showBoard(data);
      })
      .catch(function(){ showBadLink(); });
  }
})();
